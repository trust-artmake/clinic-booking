<!DOCTYPE html>
<!--
  poc/index.html — お客様向け予約ページ（Supabase版・本番UI）。
  ・見た目／UX／ステップ遷移は GAS版 web/index.html の5ステップ予約ウィザードをそのまま踏襲。
  ・データ接続だけ GAS API → Supabase に差し替え：
      担当・メニュー       … sbGet（artists / menus / artist_menus）でアーティストごとの担当コースを組み立て
      空き日／空き枠       … sbRpc('busy_ranges') ＋ stores の営業時間・刻み・施術時間からクライアントで算出
      予約確定             … sbRpc('create_public_reservation')（二重予約はDB側で物理的に防止）
      LINE通知             … Supabase Edge Function（notify-reservation）へ依頼
  ・?ref=（流入元タグ）を予約に記録、?store= で店舗slug切替（既定 kurume）、LIFFでお客様UID/お名前を取得。
  ・キャンセル(s-cancel)は実装済み（?mode=cancel：自分のLINE UIDの予約のみ my_reservations/cancel_my_reservation）。
  ・同意書(s-consent)は方式A（指で署名→画像保存）で実装済み（?mode=consent：本文＋写真Y/N＋署名→submit_consent）。
  ・※実顧客公開前に本人確認(LIFF IDトークン検証#92)を入れる前提。テスト＋対面署名運用では現状で可。
  ・GitHub Pages 等で配信する純粋な静的HTML。外部依存は LIFF SDK のCDNのみ。
-->
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <!-- H5 Phase2小粒：CSP（enforcing）。GitHub Pagesは独自HTTPヘッダ不可のためmetaで設定。
       実リソース監査（2026-06-11）に基づく許可リスト：
       ・script-src : 外部scriptは LIFF SDK（static.line-scdn.net）のみ。インラインJSは 'unsafe-inline' で許容（撤去はPhase2本丸）
       ・connect-src: fetchは Supabase（REST/RPC/Edge Function）のみ。LIFF SDK内部通信（api.line.me等）は
                      公式に固定の一覧が無いため https://*.line.me https://*.line-scdn.net で安全側に許可
       ・img-src    : アーティスト写真＝Supabase Storage 公開URL。LINEプロフィール画像CDN（profile.line-scdn.net）は
                      現状未使用だが LIFFページのため安全側に許可
       ・frame-ancestors / report-uri は meta では効かない → クリックジャッキングは下のJSフレームバスティングで代替 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.line-scdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://stgarheuldubyrzdqzaq.supabase.co https://profile.line-scdn.net; connect-src 'self' https://stgarheuldubyrzdqzaq.supabase.co https://*.line.me https://*.line-scdn.net; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style id="fbGuard">body{display:none !important}</style>
  <script>
  // クリックジャッキング対策（GitHub PagesはX-Frame-Options等のHTTPヘッダ不可のためJSで代替）。
  // OWASP推奨方式：通常表示なら上の隠しstyleを外す／枠(iframe)内なら本文を隠したまま離脱を試みる。
  // sandbox属性で離脱(top.location)を封じられても本文が見えないため、クリックの騙し取りが成立しない。
  if(self===top){var fbg=document.getElementById('fbGuard');if(fbg)fbg.parentNode.removeChild(fbg);}
  else{top.location=self.location;}
  // CSP違反の観測（consoleに記録するだけ。外部送信はしない）
  document.addEventListener('securitypolicyviolation',function(e){console.warn('CSP違反:',e.violatedDirective,e.blockedURI)});
  </script>
  <title>ご予約</title>
  <style>
    /* ===== デザイントークン（色の一括変更スイッチ・2026-06-12 UI刷新）=====
       見た目はここの変数を直すだけで全体に反映される。多店舗のテーマ色替えもここ。
       ※機能・レイアウト・表示制御（display等）は従来のまま＝色・装飾のみの変更。 */
    :root {
      --bg: #faf7f3;            /* 背景：温かみのある生成り */
      --surface: #ffffff;       /* カード面 */
      --ink: #3d3430;           /* 文字：温かい墨色 */
      --muted: #8c8076;         /* 補足文字 */
      --brand: #a8705c;         /* ブランド色：テラコッタローズ */
      --brand-deep: #8c5547;    /* 濃いブランド色（小さな文字・選択日） */
      --brand-grad: linear-gradient(135deg, #8c5547, #a8705c);
      --brand-soft: #f8efe9;    /* 選択時のうす色背景 */
      --brand-line: #e8d6cb;    /* カードの枠線 */
      --gold: #c5a572;          /* 金の差し色 */
      --line: #eee3da;          /* 区切り線 */
      --serif: 'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }

    /* ===== Loading / Done ===== */
    #s-loading { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:var(--muted); font-size:14px; }
    #s-done { display:none; min-height:100vh; padding:60px 24px; text-align:center; }
    .done-icon { font-size:56px; margin-bottom:16px; }
    .done-title { font-size:21px; font-weight:700; color:var(--brand-deep); margin-bottom:10px; font-family:var(--serif); letter-spacing:.06em; }
    .done-msg { font-size:14px; color:#6b6058; line-height:1.8; }

    /* ===== Wizard ===== */
    #s-wizard { display:none; }

    /* ===== Header ===== */
    .app-hd { background:var(--brand-grad); color:#fff; padding:15px 18px 13px; border-bottom:3px solid var(--gold); }
    .app-hd h1 { font-size:17px; font-weight:600; font-family:var(--serif); letter-spacing:.14em; }
    .app-hd .sub { font-size:11.5px; opacity:.85; margin-top:2px; letter-spacing:.05em; }

    /* ===== Progress ===== */
    .prog-wrap { background:var(--surface); padding:10px 16px 8px; border-bottom:1px solid var(--line); }
    .prog-dots { display:flex; gap:5px; margin-bottom:4px; }
    .prog-dot { flex:1; height:4px; background:#ece2d9; border-radius:2px; }
    .prog-dot.done { background:var(--brand); }
    .prog-dot.act { background:#d9b9a9; }
    .prog-lbl { font-size:11px; color:var(--muted); text-align:right; letter-spacing:.04em; }

    /* ===== Content + Nav ===== */
    .step-wrap { padding:22px 16px 90px; max-width:480px; margin:0 auto; }
    .step-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.96); border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; z-index:20; box-shadow:0 -4px 16px rgba(61,52,48,.06); }
    .s-title { font-size:18px; font-weight:700; margin-bottom:18px; font-family:var(--serif); letter-spacing:.05em; }
    .s-sub { font-size:13px; color:#7d7268; margin:-12px 0 16px; }

    /* ===== Nurse cards ===== */
    .nurse-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .nurse-card { background:var(--surface); border:1.5px solid var(--brand-line); border-radius:18px; padding:20px 12px 16px; text-align:center; cursor:pointer; transition:border-color .15s,background .15s,box-shadow .15s; box-shadow:0 2px 10px rgba(140,85,71,.05); }
    .nurse-card.sel { border-color:var(--brand); background:var(--brand-soft); box-shadow:0 4px 14px rgba(140,85,71,.12); }
    .n-av { width:72px; height:72px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; color:#fff; overflow:hidden; box-shadow:0 0 0 3px #fff, 0 0 0 4px var(--brand-line); }
    .n-av img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .n-nm { font-size:18px; font-weight:700; font-family:var(--serif); letter-spacing:.04em; }
    .n-pr { font-size:12px; color:var(--brand-deep); margin-top:4px; font-weight:600; }

    /* ===== Course list ===== */
    .course-list { display:flex; flex-direction:column; gap:10px; }
    .course-item { background:var(--surface); border:1.5px solid var(--brand-line); border-radius:14px; padding:14px 16px; cursor:pointer; display:flex; align-items:flex-start; gap:12px; }
    .course-item.sel { border-color:var(--brand); background:var(--brand-soft); }
    .c-rd { width:20px; height:20px; border-radius:50%; border:2px solid #d8cabe; flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; }
    .course-item.sel .c-rd { border-color:var(--brand); background:var(--brand); }
    .c-dot { width:7px; height:7px; border-radius:50%; background:#fff; }
    .c-body { flex:1; }
    .c-nm { font-size:14px; font-weight:600; line-height:1.4; }
    .c-pr { font-size:15px; font-weight:700; color:var(--brand-deep); margin-top:6px; }
    .c-dur { font-size:11px; color:var(--muted); margin-top:3px; }

    /* ===== Artist accordion (STEP 1) ===== */
    .art-acc { display:flex; flex-direction:column; gap:14px; max-width:600px; margin:0 auto; }
    .art-card { background:var(--surface); border:1.5px solid var(--brand-line); border-radius:18px; overflow:hidden; transition:border-color .15s,box-shadow .15s; box-shadow:0 2px 10px rgba(140,85,71,.06); }
    .art-card.open { border-color:var(--brand); box-shadow:0 6px 20px rgba(140,85,71,.14); }
    .art-hd { display:flex; align-items:center; gap:16px; padding:18px 18px; cursor:pointer; }
    .art-av { width:72px; height:72px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:#fff; overflow:hidden; box-shadow:0 0 0 3px #fff, 0 0 0 4px var(--brand-line); }
    .art-av img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .art-meta { flex:1; }
    .art-nm { font-size:18px; font-weight:700; font-family:var(--serif); letter-spacing:.04em; }
    .art-spec { font-size:12.5px; color:#857a70; margin-top:3px; line-height:1.45; }
    .art-pr { font-size:13px; color:var(--brand-deep); font-weight:700; margin-top:4px; }
    .art-chev { font-size:15px; color:#cdbfb3; transition:transform .2s,color .2s; flex-shrink:0; }
    .art-card.open .art-chev { transform:rotate(180deg); color:var(--brand); }
    .art-panel { border-top:1px solid var(--line); padding:12px 0 14px; background:#fbf6f1; }
    .art-hint { font-size:11px; color:var(--muted); margin:0 14px 10px; }
    /* コースは横スクロール（カルーセル）。次のカードが少し見えることで「横に動かせる」と伝える。 */
    .ac-list { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; padding:2px 14px 10px; scroll-padding-left:14px; }
    .ac-list::-webkit-scrollbar { height:4px; }
    .ac-list::-webkit-scrollbar-thumb { background:#dccdc0; border-radius:2px; }
    .ac-item { scroll-snap-align:start; flex:0 0 76%; box-sizing:border-box; background:var(--surface); border:1px solid var(--brand-line); border-radius:14px; padding:14px; cursor:pointer; display:flex; flex-direction:column; box-shadow:0 1px 6px rgba(140,85,71,.05); }
    .ac-item:active { background:var(--brand-soft); border-color:var(--brand); }
    .ac-top { flex:1; }
    .ac-cta { margin-top:12px; text-align:center; font-size:13px; font-weight:700; color:#fff; background:var(--brand-grad); border:none; border-radius:10px; padding:10px 4px; letter-spacing:.06em; box-shadow:0 3px 10px rgba(140,85,71,.22); }
    .s1-hint { flex:1; text-align:center; font-size:12px; color:var(--muted); padding:4px 0; }

    /* ===== Calendar ===== */
    .cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .cal-btn { width:36px; height:36px; border:1px solid var(--brand-line); border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:22px; color:var(--brand-deep); flex-shrink:0; line-height:1; }
    .cal-btn:disabled { opacity:.25; cursor:default; }
    .cal-mo { font-size:16px; font-weight:700; font-family:var(--serif); letter-spacing:.08em; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .cal-dow { text-align:center; font-size:11px; font-weight:700; color:#b3a698; padding:4px 0 6px; }
    .cal-dow:first-child { color:#c75d4f; }
    .cal-dow:last-child { color:#6b7fb3; }
    .cal-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:13px; border-radius:50%; color:#d5c9bd; cursor:default; }
    .cal-day.avail { color:var(--ink); cursor:pointer; font-weight:600; }
    .cal-day.avail:active { background:var(--brand-soft); }
    .cal-day.avail.sun { color:#c75d4f; }
    .cal-day.avail.sat { color:#6b7fb3; }
    .cal-day.today { font-weight:800; box-shadow:inset 0 0 0 1.5px var(--brand-line); }
    .cal-day.sel { background:var(--brand-deep) !important; color:#fff !important; }
    .cal-day.phantom { visibility:hidden; }
    .cal-info { font-size:12px; color:var(--muted); margin-top:10px; text-align:center; }

    /* ===== Time slots ===== */
    .dt-lbl { font-size:15px; font-weight:700; margin-bottom:14px; font-family:var(--serif); letter-spacing:.04em; }
    .slot-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .slot-a { background:var(--surface); border:1.5px solid var(--brand); border-radius:10px; color:var(--brand-deep); font-size:14px; font-weight:600; padding:10px 4px; text-align:center; cursor:pointer; }
    .slot-a.sel { background:var(--brand-deep); color:#fff; }
    .slot-a:active { background:var(--brand-soft); }
    .slot-x { background:#f4ede6; border:1px solid #eadfd5; border-radius:10px; color:#cfc2b5; font-size:18px; padding:10px 4px; text-align:center; }

    /* ===== Form ===== */
    .field { margin-bottom:18px; }
    .fl { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
    .req { color:#c0392b; margin-left:2px; }
    input[type=text], input[type=tel], textarea { width:100%; padding:12px; font-size:16px; border:1px solid #ddd0c4; border-radius:10px; background:var(--surface); -webkit-appearance:none; font-family:inherit; color:var(--ink); }
    input[type=text]:focus, input[type=tel]:focus, textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(168,112,92,.14); }
    textarea { resize:vertical; }
    .ferr { font-size:12px; color:#c0392b; margin-top:4px; display:none; }
    .radios { display:flex; gap:8px; }
    .radios label { flex:1; text-align:center; padding:10px; border:1.5px solid #ddd0c4; border-radius:10px; background:var(--surface); font-size:14px; cursor:pointer; }
    .radios input { display:none; }
    .radios label:has(input:checked) { border-color:var(--brand); background:var(--brand-soft); font-weight:600; }
    .radios-v { display:flex; flex-direction:column; gap:8px; }
    .radios-v label { padding:10px 14px; border:1.5px solid #ddd0c4; border-radius:10px; background:var(--surface); font-size:14px; display:flex; align-items:center; gap:10px; cursor:pointer; }
    .radios-v input[type=radio] { width:18px; height:18px; flex-shrink:0; accent-color:var(--brand); }
    .radios-v label:has(input:checked) { border-color:var(--brand); background:var(--brand-soft); }

    /* ===== Summary ===== */
    .sum-box { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:20px; box-shadow:0 2px 10px rgba(140,85,71,.05); }
    .s-row { display:flex; padding:8px 0; border-bottom:1px solid #f5ede5; }
    .s-row:last-child { border-bottom:none; }
    .s-key { font-size:12px; color:var(--muted); width:80px; flex-shrink:0; padding-top:1px; }
    .s-val { font-size:14px; font-weight:600; flex:1; }

    /* ===== Terms ===== */
    .sec-lbl { font-size:13px; font-weight:700; color:var(--brand-deep); border-left:3px solid var(--gold); padding-left:8px; margin-bottom:12px; letter-spacing:.04em; }
    .terms-box { height:180px; overflow-y:auto; border:1px solid #ddd0c4; border-radius:10px; padding:12px 14px; font-size:12px; color:#4f463f; background:var(--surface); line-height:1.75; }
    .terms-box p { margin-bottom:8px; }
    .terms-box ul { margin:4px 0 10px 18px; padding:0; }
    .terms-box li { margin-bottom:4px; }
    .t-hd { font-weight:700; color:var(--ink); display:block; margin:10px 0 4px; }
    .t-sub { font-weight:700; color:#5d534a; display:block; font-size:11px; margin:6px 0 2px; }
    .agree-row { display:flex; align-items:flex-start; gap:10px; margin-top:14px; }
    .agree-row input { width:18px; height:18px; flex-shrink:0; margin-top:2px; accent-color:var(--brand); }
    .agree-row span { font-size:13px; color:#4f463f; }

    /* ===== Buttons ===== */
    .btn { padding:14px; font-size:16px; font-weight:700; border-radius:14px; border:none; cursor:pointer; font-family:inherit; letter-spacing:.04em; }
    .btn-p { flex:1; background:var(--brand-grad); color:#fff; box-shadow:0 4px 14px rgba(140,85,71,.28); }
    .btn-p:disabled { background:#ddccc1; box-shadow:none; }
    .btn-p:active { transform:translateY(1px); }
    .btn-bk { background:#f6f0ea; color:#6b6058; border:1px solid #e3d7cb; width:76px; flex-shrink:0; font-size:14px; }

    /* ===== Spinner / Error ===== */
    .ld-box { text-align:center; padding:36px 0; color:var(--muted); font-size:13px; }
    .spinner { display:inline-block; width:26px; height:26px; border:3px solid #ece1d7; border-top-color:var(--brand); border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .msg-err { background:#fdecea; color:#b3261e; padding:12px; border-radius:10px; font-size:13px; }
    .btn-retry { background:var(--brand-grad); color:#fff; border:none; border-radius:10px; padding:10px 28px; font-size:14px; font-weight:600; cursor:pointer; }

    /* ===== Cancel（お客様によるキャンセル） ===== */
    #s-cancel { display:none; }
    #s-cancel .step-wrap { min-height:60vh; }
    #s-consent { display:none; }
    #s-consent .step-wrap { min-height:50vh; }
    #s-questionnaire { display:none; }
    #s-questionnaire .step-wrap { min-height:50vh; }
    .q-f { margin:0 0 16px; }
    .q-l { display:block; font-size:14px; font-weight:600; color:var(--ink); margin:0 0 6px; }
    .q-req { font-size:11px; color:#c0392b; font-weight:700; margin-left:4px; }
    .q-in { width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid #ddd0c4; border-radius:10px; font-size:15px; }
    .q-opts { display:flex; flex-wrap:wrap; gap:8px 14px; }
    .q-opt { font-size:14px; color:var(--ink); display:inline-flex; align-items:center; gap:5px; }
    .cl-loading { text-align:center; color:var(--muted); padding:48px 0; }
    .cl-intro { font-weight:700; color:var(--brand-deep); margin:0 4px 12px; }
    .cl-sub { font-weight:400; font-size:12px; color:var(--muted); }
    .cl-late { font-size:12.5px; color:#c2410c; background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; padding:8px 10px; line-height:1.5; }
    .cl-card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin:0 0 12px; box-shadow:0 2px 8px rgba(140,85,71,.06); }
    .cl-dt { font-weight:800; font-size:16px; color:var(--ink); }
    .cl-meta { font-size:13px; color:#6b6058; line-height:1.5; margin:4px 0 10px; }
    .cl-x { width:100%; background:#fdf3f1; color:#c2410c; border:1px solid #f0c8c2; }
    .cl-x:disabled { opacity:.6; }
    .cl-note { font-size:11.5px; color:#a99e93; margin:8px 4px; line-height:1.5; }
    .soon-box { text-align:center; padding:48px 16px; color:#6b6058; }
    .soon-box .done-icon { font-size:46px; }

    /* ===== Consent（同意書：本文→写真Yes/No→指署名→送信） ===== */
    .cs-greet { font-size:14px; font-weight:700; color:var(--brand-deep); margin:0 2px 6px; }
    .cs-meta { font-size:12px; color:var(--muted); margin:0 2px 14px; }
    .cs-read { height:300px; overflow-y:auto; border:1px solid #ddd0c4; border-radius:10px; padding:14px 16px; font-size:12.5px; color:#4f463f; background:var(--surface); line-height:1.8; -webkit-overflow-scrolling:touch; }
    .cs-read h3 { font-size:13px; margin:14px 0 4px; border-left:4px solid var(--brand); padding-left:8px; color:var(--ink); }
    .cs-read h3:first-child { margin-top:2px; }
    .cs-read p { margin:0 0 8px; }
    .cs-read ul { margin:4px 0 10px 18px; padding:0; }

// ===== Supabase REST / RPC =====
function sbGet(path){
  return fetch(SB_URL + "/rest/v1/" + path, { headers: H })
    .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, data:j }; }); });
}
function sbRpc(fn, args){
  return fetch(SB_URL + "/rest/v1/rpc/" + fn, {
    method:"POST", headers: Object.assign({ "Content-Type":"application/json" }, H), body: JSON.stringify(args||{})
  }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, data:j }; }, function(){ return { ok:r.ok, status:r.status, data:null }; }); });
}
// ===== 本人確認つき操作（#92）：キャンセル・同意書は Edge Function(liff-action) 経由 =====
// LINEのIDトークン(st.idToken)を送り、サーバー側でLINEに照合→確認できた本人だけが実行できる。
// 戻り値は sbRpc と同じ { ok, status, data } 形（失敗時 data.message にエラー種別）。
// ※Supabase上の関数スラッグは super-api（表示名は liff-action）。エンドポイントはスラッグ側を使う。
var EDGE_LIFF = SB_URL + "/functions/v1/super-api";
function sbEdge(action, args){
  var body = Object.assign({ action: action, id_token: (st.idToken||'') }, args||{});
  // ★apikey/Authorization(anonキー)も送る＝Edge FunctionのVerify JWTがON/OFFどちらでも通る。
  //   本人確認はあくまでサーバ側のLINE IDトークン検証で担保（anonキーは公開前提・ゲート通過用）。
  return fetch(EDGE_LIFF, {
    method:"POST", headers: Object.assign({ "Content-Type":"application/json" }, H), body: JSON.stringify(body)
  }).then(function(r){
    return r.json().then(function(j){
      return { ok: !!(j && j.ok), status:r.status, data:(j ? j.data : null) };
    }, function(){ return { ok:false, status:r.status, data:null }; });
  });
}

    if(!st.idemKey){ st.idemKey = 'idem-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2); }

function p2(n){ return n<10?'0'+n:''+n; }

function hmToMin(v, fb){
  if(v==null) return fb;
  if(typeof v==='number') return v*60;
  var m=String(v).match(/^(\d{1,2}):(\d{2})/);
  if(!m) return fb;
  return parseInt(m[1],10)*60+parseInt(m[2],10);
}

// ===== STEP 1: アーティスト＆コース（アコーディオン） =====
var AC=['#b98a74','#a8705c','#8c5547','#c5a572']; // 写真未設定時の頭文字アイコン背景（テーマ暖色系・2026-06-12）

// コースの並び順：①眉セット ②眉通常価格 ③眉他院修正 ④眉リタッチ再来 ⑤リップセット ⑥リップ通常価格。
// 各グループ内は安い順（再来だけは「2回目→3回目」の回数順）。
function sortCourses(menus){
  function info(m){
    var nm=m.menu_name||'';
    var lip=nm.indexOf('リップ')>=0, ret=nm.indexOf('再来')>=0, fix=nm.indexOf('他院修正')>=0;
    var set=nm.indexOf('セット')>=0||nm.indexOf('割引コース')>=0;
    var base = lip ? (set?5:6) : (ret?4 : fix?3 : set?1 : 2);
    var sub;
    if(ret){ var mt=nm.match(/(\d+)回目/); sub=mt?parseInt(mt[1],10):99; }
    else { var p=parseInt(m.normal_price,10); sub=isNaN(p)?9999999:p; }
    return { base:base, sub:sub };
  }
  return menus.slice().sort(function(a,b){
    var ia=info(a), ib=info(b);
    return ia.base!==ib.base ? ia.base-ib.base : ia.sub-ib.sub;
  });
}
function s1(){
  var ns=(st.options.nurses||[]).filter(function(n){return isT(n.is_active);});
  var h='<div class="s-title">アーティストを選んでください</div>';

    // このアーティストが対応できるメニュー（認定済み）
    var cert=(st.options.certified||[]).filter(function(c){return String(c.nurse_id)===String(n.nurse_id)&&isT(c.is_certified);});
    var cm={}; cert.forEach(function(c){cm[String(c.menu_id)]=c;});
    var menus=sortCourses((st.options.menus||[]).filter(function(m){return cm[String(m.menu_id)];}));
    // ヘッダーの「〜」価格は全コース中の最安値。
    //   ★monitor_price < normal_price なら monitor 側を最安候補に入れる（patch-48）。
    //     お客様視点で「ここから始まる最安値」を見せたいので、設定があれば安い方を使う。
    var minP=null;
    menus.forEach(function(m){
      var pn=parseInt(m.normal_price,10);
      var pm=parseInt(m.monitor_price,10);
      var p=(!isNaN(pm)&&pm>0&&pm<pn)?pm:pn;
      if(!isNaN(p)&&p>0&&(minP===null||p<minP))minP=p;
    });
    var av=n.profile_photo_url
      ?'<div class="art-av"><img src="'+esc(n.profile_photo_url)+'" alt="'+esc(n.name)+'"></div>'
      :'<div class="art-av" style="background:'+AC[i%AC.length]+'">'+esc((n.name||'?').charAt(0).toUpperCase())+'</div>';
    var open=String(n.nurse_id)===String(st.openArtist);
    h+='<div class="art-card'+(open?' open':'')+'">';
    h+='<div class="art-hd" onclick="toggleArt(\''+esc(n.nurse_id)+'\')">';
    var specBits=[]; if(n.qualification)specBits.push(n.qualification); if(n.specialty)specBits.push(n.specialty);
    h+=av+'<div class="art-meta"><div class="art-nm">'+esc(n.name)+'</div>';
    if(specBits.length)h+='<div class="art-spec">'+esc(specBits.join('・'))+'</div>';
    if(minP)h+='<div class="art-pr">¥'+minP.toLocaleString()+'〜</div>';
    h+='</div><div class="art-chev">&#9660;</div></div>';
    if(open){
      h+='<div class="art-panel"><div class="art-hint">コースを横にスライドして選べます。タップすると日時の選択へ進みます。</div>';
      h+='<div class="ac-list">';
      menus.forEach(function(m){
        var c=cm[String(m.menu_id)];
        var isRet=m.menu_name&&m.menu_name.indexOf('再来')>=0;
        var dm=c?parseInt(isRet?c.duration_retouch_min:c.duration_new_min,10):0;
        var dt=dm>0?Math.floor(dm/60)+'時間'+(dm%60>0?dm%60+'分':''):'';
        // ★patch-48：STEP1は「通常 ¥◯ ／ モニター ¥◯」併記。お客様が両方の価格を一目で把握できる。
        //   monitor_price が未設定 or normal_price と同額なら従来通り単独表示（混乱回避）。
        var p=parseInt(m.normal_price,10);
        var pm=parseInt(m.monitor_price,10);
        var hasMon=(!isNaN(pm)&&pm>0&&pm<p);
        var pt;
        if(hasMon){
          pt='通常 ¥'+p.toLocaleString()+' ／ モニター ¥'+pm.toLocaleString()+'（税込）';
        } else {
          pt=(!isNaN(p)&&p>0)?'¥'+p.toLocaleString()+'（税込）':'';
        }
        h+='<div class="ac-item" data-nid="'+esc(n.nurse_id)+'" data-nm="'+esc(n.name)+'" data-mid="'+esc(m.menu_id)+'" data-mn="'+esc(m.menu_name)+'" data-pr="'+(p||0)+'" data-prm="'+(hasMon?pm:0)+'" data-du="'+(dm||0)+'">';
        h+='<div class="ac-top"><div class="c-nm">'+esc(m.menu_name)+'</div>';
        if(pt)h+='<div class="c-pr">'+pt+'</div>';
        if(dt)h+='<div class="c-dur">施術時間：'+dt+'</div>';
        // ★patch-48改：モニター価格があるメニューは「どっちで予約するか」を確認画面で選ぶ運用＝
        //   STEP1段階でお客様が「結局どっちの金額なの？」と迷わないよう、案内文を表示する。
        if(hasMon) h+='<div class="c-note" style="font-size:12px;color:#6b7280;margin-top:4px">※通常価格／モニター価格は、この後の確認画面でお選びいただけます</div>';
        h+='</div><div class="ac-cta">このコースで予約 →</div></div>';
      });
      h+='</div></div>';
    }
    h+='</div>';
  });
  h+='</div>';
  document.getElementById('sc').innerHTML=h;
  document.getElementById('sn').innerHTML='<div class="s1-hint">アーティストとコースをお選びください</div>';
}
function applyInitialArtist(){

}

// コース確定：アーティスト＋コースを一度に確定し、日付選択（STEP2）へ直行する。
function pickCourse(nid,nname,mid,mname,price,dur,priceMonitor){
  st.nurseId=nid; st.nurseName=nname;
  st.menuId=mid; st.menuName=mname; st.menuPrice=price; st.menuPriceMonitor=priceMonitor||0; st.menuDur=dur;
  st.monitorChoice=null;  // ★コース選択時は「モニター有無」をリセット＝STEP6で必ず選び直してもらう
  st.menuType=(mname&&mname.indexOf('再来')>=0)?'retouch':'new';
  st.openArtist=nid;
  st.date=null; st.time=null; st.availDates=null; st.slots=null; st.adErr=false; st.slErr=false;
  st.slCache={};
  go(2);
}

// ===== 店舗の営業時間／刻み／定休日 =====
// stores から取得（business_hours_start / business_hours_end / slot_interval_min / closed_days）。
// closed_days は自由記述文字列。曜日名（例「月曜」）や YYYY-MM-DD が含まれていれば該当日を除外する。
function storeOpenMin(){ return st.options&&st.options.openMin!=null ? st.options.openMin : DEF_OPEN_H*60; }
function storeCloseMin(){ return st.options&&st.options.closeMin!=null ? st.options.closeMin : DEF_CLOSE_H*60; }
function storeInterval(){ var v=st.options&&st.options.interval; return (v&&v>0)?v:DEF_INTERVAL; }
var DOWJA=['日','月','火','水','木','金','土'];
function parseClosed(s){
  // 戻り値 { dows:Set<0..6>, dates:Set<'YYYY-MM-DD'> }
  var dows=new Set(), dates=new Set();
  if(!s) return { dows:dows, dates:dates };
  var txt=String(s);
  // 個別日（YYYY-MM-DD / YYYY/MM/DD）
  (txt.match(/\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/g)||[]).forEach(function(d){
    var m=d.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if(m) dates.add(m[1]+'-'+p2(parseInt(m[2],10))+'-'+p2(parseInt(m[3],10)));
  });
  // 曜日名
  for(var i=0;i<7;i++){ if(txt.indexOf(DOWJA[i])>=0) dows.add(i); }
  if(/日曜/.test(txt)) dows.add(0);
  if(/[Ss]un/.test(txt)) dows.add(0);
  if(/[Mm]on/.test(txt)) dows.add(1);
  if(/[Tt]ue/.test(txt)) dows.add(2);
  if(/[Ww]ed/.test(txt)) dows.add(3);
  if(/[Tt]hu/.test(txt)) dows.add(4);
  if(/[Ff]ri/.test(txt)) dows.add(5);
  if(/[Ss]at/.test(txt)) dows.add(6);
  return { dows:dows, dates:dates };
}
function isClosedDay(d){
  var c=st.options&&st.options.closed; if(!c) return false;
  if(c.dows.has(d.getDay())) return true;
  if(c.dates.has(ymd(d))) return true;
  return false;
}
// 予約可能な「候補日」か（今日〜45日先・定休日除外）。空き有無は別途 busy_ranges で判定。
function isBookableDay(d){
  if(d<TODAY) return false;
  if(d>MAX_DATE) return false;
  if(isClosedDay(d)) return false;
  return true;
}

// ===== STEP 3: 日付選択 =====
var DOW=['日','月','火','水','木','金','土'];
function s3(){
  var ms=p2(st.calMonth), dcnt=new Date(st.calYear,st.calMonth,0).getDate();
  var first=new Date(st.calYear,st.calMonth-1,1).getDay();
  var canPrev=!(st.calYear===INIT_Y&&st.calMonth===INIT_M);
  // 翌月以降に候補日が無ければ「次へ」を止める（45日上限）。
  var nextFirst=new Date(st.calYear,st.calMonth,1);
  var canNext=(nextFirst<=MAX_DATE);
  var h='<div class="s-title">日付を選んでください</div>';
  h+='<div class="cal-nav">';
  h+='<button class="cal-btn" onclick="calMv(-1)" '+(canPrev?'':'disabled')+'>&#8249;</button>';
  h+='<div class="cal-mo">'+st.calYear+'年'+st.calMonth+'月</div>';
  h+='<button class="cal-btn" onclick="calMv(1)" '+(canNext?'':'disabled')+'>&#8250;</button></div>';
  h+='<div class="cal-grid">';
  DOW.forEach(function(d){h+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<first;i++) h+='<div class="cal-day phantom"></div>';
  for(var d=1;d<=dcnt;d++){
    var ds=st.calYear+'-'+ms+'-'+p2(d);
    var dd=new Date(st.calYear,st.calMonth-1,d);
    var dow=(first+d-1)%7;
    var bookable=isBookableDay(dd);
    var avail=bookable&&st.availDates&&st.availDates.has(ds), isSel=ds===st.date;
    var cls='cal-day';
    if(isSel) cls+=' sel';
    else if(avail){ cls+=' avail'; if(dow===0)cls+=' sun'; else if(dow===6)cls+=' sat'; }
    if(dd.getTime()===TODAY.getTime())cls+=' today';
    var click=(avail)?' onclick="pickD(\''+ds+'\')"':'';
    h+='<div class="'+cls+'"'+click+'>'+d+'</div>';
  }
  h+='</div>';
  if(st.adErr){
    h+='<div class="msg-err">空き情報を取得できませんでした。電波の良い場所で、もう一度お試しください。<div style="margin-top:10px"><button class="btn-retry" onclick="retryAD()">再試行</button></div></div>';
  }else if(st.availDates===null){
    h+='<div class="ld-box"><span class="spinner"></span>空き情報を取得中…</div>';
    setTimeout(loadAD,0);
  }else if(st.availDates.size===0){
    h+='<div class="cal-info">今月は空き枠がありません。'+(canNext?'翌月をご確認ください。':'別の条件をご確認ください。')+'</div>';
  }
  document.getElementById('sc').innerHTML=h;
  document.getElementById('sn').innerHTML='<button class="btn btn-bk" onclick="go(1)">戻る</button><button class="btn btn-p" onclick="st.date&&go(3)" '+(st.date?'':'disabled')+'>次へ</button>';
}
function calMv(dir){
  st.calMonth+=dir;
  if(st.calMonth>12){st.calMonth=1;st.calYear++;}
  if(st.calMonth<1){st.calMonth=12;st.calYear--;}
  st.availDates=null; st.adErr=false; s3();
}

// 表示中の月で「候補日」を集め、各日の busy_ranges から1枠でも空けば available_dates に入れる。
// busy_ranges は月の全予約をまとめて1回取得し、クライアントで日別に振り分ける（高速・PII非取得）。
function loadAD(){
  var reqN=st.nurseId, reqM=st.menuId, reqY=st.calYear, reqMo=st.calMonth;
  // 月内の候補日リスト
  var dcnt=new Date(reqY,reqMo,0).getDate();
  var cand=[];
  for(var d=1;d<=dcnt;d++){ var dd=new Date(reqY,reqMo-1,d); if(isBookableDay(dd)) cand.push(ymd(dd)); }
  if(!cand.length){
    if(String(st.nurseId)===String(reqN)&&String(st.menuId)===String(reqM)&&st.calYear===reqY&&st.calMonth===reqMo){
      st.availDates=new Set(); st.adErr=false; if(st.step===2)s3();
    }
    return;
  }
  // 月初〜月末の予約を一括取得（JST境界）。
  var pFrom=reqY+'-'+p2(reqMo)+'-01T00:00:00+09:00';
  var endD=new Date(reqY,reqMo,1); // 翌月1日
  var pTo=endD.getFullYear()+'-'+p2(endD.getMonth()+1)+'-01T00:00:00+09:00';
  sbRpc('busy_ranges',{ p_artist:reqN, p_from:pFrom, p_to:pTo, p_store:STORE_ID }).then(function(r){
    var same=(String(st.nurseId)===String(reqN)&&String(st.menuId)===String(reqM)&&st.calYear===reqY&&st.calMonth===reqMo);
    if(!r.ok){ if(same){ st.adErr=true; if(st.step===2)s3(); } return; }
    var busyByDay={};
    (r.data||[]).forEach(function(x){
      var s=new Date(x.start_at).getTime(), e=new Date(x.end_at).getTime();
      // 予約をその開始日（JST）に振り分け
      var key=jstDateKey(x.start_at);
      (busyByDay[key]=busyByDay[key]||[]).push([s,e]);
    });
    var set=new Set();
    cand.forEach(function(ds){
      var slots=computeSlots(ds, busyByDay[ds]||[]);
      if(slots.some(function(s){return s.available;})) set.add(ds);
    });
    if(same){ st.availDates=set; st.adErr=false; if(st.step===2)s3(); }
  }).catch(function(){
    if(String(st.nurseId)===String(reqN)&&String(st.menuId)===String(reqM)&&st.calYear===reqY&&st.calMonth===reqMo){
      st.adErr=true; if(st.step===2)s3();
    }
  });
}
// ISO日時(+09:00やZ)を JSTの 'YYYY-MM-DD' に変換（日別振り分け用）。
function jstDateKey(iso){
  var d=new Date(iso);
  var j=new Date(d.getTime()+9*3600000);
  return j.getUTCFullYear()+'-'+p2(j.getUTCMonth()+1)+'-'+p2(j.getUTCDate());
}
// 「再試行」ボタン：エラー状態を解除して空き情報を取り直す。
function retryAD(){ st.adErr=false; st.availDates=null; s3(); }
function pickD(ds){ st.date=ds; st.time=null; st.slots=null; st.slErr=false; s3(); prefetchSl(); }

// ===== 空き枠計算（GAS版 loadSlots と同じ考え方） =====
// 店舗営業時間内を interval 刻みで作り、施術時間ぶん収まり、busy（予約済み）と重ならない枠だけ available=true。
function computeSlots(dateStr, busy){
  var openMin=storeOpenMin(), closeMin=storeCloseMin(), interval=storeInterval();
  var dur=(st.menuDur&&st.menuDur>0)?st.menuDur:60;
  var now=Date.now();
  var out=[];
  for(var mins=openMin; mins+dur<=closeMin; mins+=interval){
    var hh=p2(Math.floor(mins/60)), mm=p2(mins%60), t=hh+':'+mm;
    var s=new Date(dateStr+'T'+t+':00+09:00').getTime(), e=s+dur*60000;
    var future=s>now; // 過去時刻は出さない（当日用）
    var free=future && busy.every(function(b){ return e<=b[0] || s>=b[1]; });
    out.push({ time:t, available:free });
  }
  return out;
}

// ===== STEP 4: 時間選択 =====
function s4(){
  var pts=st.date.split('-'), dd=new Date(+pts[0],+pts[1]-1,+pts[2]);
  var dl=+pts[1]+'月'+parseInt(pts[2])+'日（'+DOW[dd.getDay()]+'）';
  var h='<div class="s-title">時間を選んでください</div><div class="dt-lbl">'+dl+'</div>';
  if(st.slErr){
    h+='<div class="msg-err">空き枠を取得できませんでした。電波の良い場所で、もう一度お試しください。<div style="margin-top:10px"><button class="btn-retry" onclick="retrySl()">再試行</button></div></div>';
  }else if(st.slots===null){
    h+='<div class="ld-box"><span class="spinner"></span>空き枠を取得中…</div>';
    setTimeout(loadSl,0);
  }else{
    var anyA=st.slots.some(function(s){return s.available;});
    if(!anyA){
      h+='<div class="msg-err">この日は空き枠がありません。前の画面から別の日をお選びください。</div>';
    }else{
      h+='<div class="slot-grid">';
      st.slots.forEach(function(s){
        if(s.available){
          var sel=s.time===st.time?' sel':'';
          h+='<div class="slot-a'+sel+'" onclick="pickT(\''+s.time+'\')">'+s.time+'</div>';
        }else{
          h+='<div class="slot-x">—</div>';
        }
      });
      h+='</div>';
    }
  }
  document.getElementById('sc').innerHTML=h;
  document.getElementById('sn').innerHTML='<button class="btn btn-bk" onclick="go(2)">戻る</button><button class="btn btn-p" onclick="st.time&&go(4)" '+(st.time?'':'disabled')+'>次へ</button>';
}
function loadSl(){
  // セッション内キャッシュを優先。
  var ck=st.nurseId+'|'+st.menuId+'|'+st.date;
  if(st.slCache[ck]){ st.slots=st.slCache[ck]; st.slErr=false; if(st.step===3)s4(); return; }
  var reqN=st.nurseId, reqMn=st.menuId, reqD=st.date;
  var pFrom=reqD+'T00:00:00+09:00', pTo=reqD+'T23:59:59+09:00';
  sbRpc('busy_ranges',{ p_artist:reqN, p_from:pFrom, p_to:pTo, p_store:STORE_ID }).then(function(r){
    var same=(String(st.nurseId)===String(reqN)&&String(st.menuId)===String(reqMn)&&String(st.date)===String(reqD));
    if(!r.ok){ if(same){ st.slErr=true; if(st.step===3)s4(); } return; }
    var busy=(r.data||[]).map(function(x){ return [new Date(x.start_at).getTime(), new Date(x.end_at).getTime()]; });
    var arr=computeSlots(reqD, busy);
    st.slCache[reqN+'|'+reqMn+'|'+reqD]=arr;
    if(same){ st.slots=arr; st.slErr=false; if(st.step===3)s4(); }
  }).catch(function(){
    if(String(st.nurseId)===String(reqN)&&String(st.menuId)===String(reqMn)&&String(st.date)===String(reqD)){
      st.slErr=true; if(st.step===3)s4();
    }
  });
}
// 「再試行」ボタン：エラー状態を解除して空き枠を取り直す。
function retrySl(){ st.slErr=false; st.slots=null; s4(); }
// 日付タップ時に裏で空き枠を先読みしておく（「次へ」を押す頃には表示済みにする）。
function prefetchSl(){
  if(!st.date) return;
  var ck=st.nurseId+'|'+st.menuId+'|'+st.date;
  if(st.slCache[ck]) return;  // 取得済みなら何もしない
  var reqN=st.nurseId, reqMn=st.menuId, reqD=st.date;
  var pFrom=reqD+'T00:00:00+09:00', pTo=reqD+'T23:59:59+09:00';
  sbRpc('busy_ranges',{ p_artist:reqN, p_from:pFrom, p_to:pTo, p_store:STORE_ID }).then(function(r){
    if(!r.ok) return;
    var busy=(r.data||[]).map(function(x){ return [new Date(x.start_at).getTime(), new Date(x.end_at).getTime()]; });
    var arr=computeSlots(reqD, busy);
    st.slCache[reqN+'|'+reqMn+'|'+reqD]=arr;
    if(String(st.nurseId)===String(reqN)&&String(st.menuId)===String(reqMn)&&String(st.date)===String(reqD)&&st.slots===null&&st.step===3){ st.slots=arr; s4(); }
  }).catch(function(){});
}
function pickT(t){ st.time=t; s4(); }

// ===== STEP 5: お客様情報 =====

// ===== STEP 6: 確認・同意・送信 =====
var CL={'yes':'有','no':'無','2set':'2回セット','50off':'50%OFFクーポン','none':'無'};
function s6(){

function sr(k,v){ return '<div class="s-row"><div class="s-key">'+k+'</div><div class="s-val">'+v+'</div></div>'; }
// ★予約ボタンの有効化＝同意 ＋（モニター選択可なら選択済み）。patch-48でモニター選択を必須条件に追加。
function canSub(){
  if (!st.agreed) return false;
  var hasMon=(st.menuPriceMonitor>0 && st.menuPriceMonitor<st.menuPrice);
  if (hasMon && !st.monitorChoice) return false;
  return true;
}
function updSub(){ var b=document.getElementById('bsub'); if(b)b.disabled=!canSub(); }
function hasLineUid(uid){ return String(uid == null ? "" : uid).trim() !== ""; }
var LINE_UID_REQUIRED_MESSAGE = 'LINEアプリで開くと予約できます。予約確認やキャンセル案内を正しくお届けするために必要です。';
function doSub(){
  if(!canSub())return;  // ★同意＋（モニター選択可なら選択済み）の両方が揃わないと送らない（patch-48）
  // ★日付・時間が未選択なら送信しない（満席で枠を捨てた後などに null:00 で送るのを防止）。時間選択へ戻す。
  if(!st.date || !st.time){
    var e0=document.getElementById('serr'); if(e0){e0.className='msg-err';e0.textContent='日付と時間をもう一度お選びください。';}
    go(3); return;
  }
  // 媒体別LIFFリンク運用の保険：LINE UID が取れない予約は本人紐付けが弱くなるため作らない。
  if(!hasLineUid(st.uid)){
    var e1=document.getElementById('serr');
    if(e1){
      e1.className='msg-err';
      e1.textContent=LINE_UID_REQUIRED_MESSAGE;
      var act1=document.createElement('div'); e1.appendChild(act1);
      renderLiffOpenButton(act1, 'LINEで予約を続ける', 'book');   // ★LINEで開き直すボタン
    }
    return;
  }
  var btn=document.getElementById('bsub');
  if(btn){btn.disabled=true;btn.textContent='送信中…';}
  // 予約確定は create_public_reservation RPC に集約（店舗・担当・メニューの正当性／席数／重複をDB側で検証）。
  var startISO=st.date+'T'+st.time+':00+09:00';
  var treatmentType=(st.menuName&&st.menuName.indexOf('再来')>=0)?'retouch':'new';
  // ★reservation_type は STEP6 でお客様が選んだ「モニター有無」で決定（patch-48 改）。
  //   モニター選択肢が無い（monitor_price 未設定 or 同額）メニューは normal 固定。
  //   DB側 create_public_reservation がこの値で price_monitor/price_normal を切替記録する。
  var hasMon=(st.menuPriceMonitor>0 && st.menuPriceMonitor<st.menuPrice);
  var reservationType=(hasMon && st.monitorChoice==='yes')?'monitor':'normal';
  // メモにクーポン種別・施術経験も残す（GAS版の補足情報を引き継ぐ）。
  var memo=buildMemo();
  sbRpc('create_public_reservation',{
    p_store: STORE_ID,
    p_artist: st.nurseId,
    p_menu: st.menuId,
    p_customer_name: st.custName,
    p_start: startISO,
    p_treatment_type: treatmentType,
    p_reservation_type: reservationType,
    p_line_uid: (st.uid || null),
    p_phone: st.phone,
    p_furigana: st.furigana,
    p_memo: memo,
    p_ref: (REF || null),
    // ★クーポンUIは patch-48 で廃止。DB側の create_public_reservation シグネチャを壊さないため
    //   p_coupon は固定 'none' を送る（旧予約データは値が残る・ラベル辞書は notify-reservation で後方互換維持）。
    p_coupon: 'none',
    p_art_experience: (st.artExp || ''),
    // ★#94 冪等キー：この送信（二度押し・通信リトライ含む）の間は同じキー。DBが同一キーの2件目を作らず既存予約IDを返す。
    //   ★冪等はDB側で line_uid 確定（LINEログイン済み）のリクエストにのみ有効。未ログイン(uid 無し)では
    //     キーを送らず null にする＝DBの挙動と揃える（未ログインのキーはDBで無視されるため送っても無意味）。
    p_idempotency_key: (st.uid ? getIdemKey() : null)
  }).then(function(r){
    if(r.ok){
      // 通知はDBトリガ→notify-reservation が内部トークンで実行（クライアントからは送らない＝なりすまし/改ざん対策）。
      // ★予約成立。次にもし別予約をするなら別キーにするため、ここで冪等キーを破棄する。
      newIdemKey();
      showScr('s-done');
      // ★LINEの中で開いた時だけ自動でトークへ戻す。ブラウザでは戻り先が無いので、戻るボタンも隠す。
      if(inLineClient()){ setTimeout(backToTalk,1200); }
      else { var _bb=document.getElementById('backBtn'); if(_bb) _bb.style.display='none'; }
      return;
    }
    var code=(r.data&&r.data.code)||'', msg=(r.data&&r.data.message)||'';
    // 重複（排他制約 23P01）・満席（seat_full）→「埋まりました」案内＋枠再読込。
    if(String(r.status)==='409' || code==='23P01' || msg==='seat_full' || /no_overlap|overlap|exclusion/i.test(msg)){
      subFail(btn,'その時間帯はちょうど埋まりました。お手数ですが、別の時間をお選びください。');
      // この枠は埋まったので、その日の空き枠と当月の空き日を捨て、時間選択画面へ戻して最新を取り直す。
      // ★時間を選び直す＝予約内容が変わるので冪等キーも破棄（次の送信は別予約として別キーにする）。
      newIdemKey();
      delete st.slCache[st.nurseId+'|'+st.menuId+'|'+st.date];
      st.slots=null; st.availDates=null; st.time=null;
      setTimeout(function(){ go(3); }, 1500);   // ★時間選択へ戻して再取得（null時間での再送を防ぐ）
    }else{
      subFail(btn, errR(code,msg));
    }
  }).catch(function(err){
    subFail(btn,'送信に失敗しました。電波の良い場所で再度お試しください。');
  });
}
function buildMemo(){
  // クーポン・施術経験は予約レコードの専用列(coupon/art_experience)に保存するため、ここはお客様メモのみ。
  return (st.memo && st.memo.trim()) ? st.memo.trim() : '';
}
function subFail(btn,msg){
  if(btn){btn.disabled=false;btn.textContent='この内容で予約する';}
  var e=document.getElementById('serr'); if(e){e.className='msg-err';e.textContent=msg;}
}
// create_public_reservation が raise した例外コード／メッセージをお客様向け文言に変換。
function errR(code,msg){
  msg=String(msg||'');
  if(/store_not_found|menu_not_in_tenant|artist_not_in_store|artist_menu_not_allowed/.test(msg))
    return 'ただいまこの組み合わせのご予約をお受けできません。お手数ですがトーク画面からお問い合わせください。';
  if(/seat_full/.test(msg))
    return '申し訳ございません。その時間帯は満席です。お手数ですが、別の日時でお試しください。';
  return '申し訳ございません、ただいまご予約をお受けできませんでした。お手数ですがトーク画面からご連絡ください。';
}
// （旧 fireNotify は廃止）予約通知は DBトリガ → notify-reservation が内部トークンで実行する。
// クライアントから公開キーで通知関数を叩く方式は、なりすまし/改ざん/スパムの温床のため撤去した。
// LIFFウィンドウを閉じてLINEのトークへ戻す。LINEアプリ外（通常ブラウザ）では何も起きない。
// LINEアプリの中で開いているか（LIFF in-client）。ブラウザでは false。
function inLineClient(){
  try{ return (typeof liff!=='undefined' && liff.isInClient && liff.isInClient()); }catch(e){ return false; }
}
function backToTalk(){
  // ★LINEの中で開いた時だけ closeWindow でトークへ戻す。
  //   ブラウザ（LINE外）では戻り先が無いので何もしない＝「外部アプリを開きますか」ポップアップを出さない。
  if(inLineClient()){ try{ liff.closeWindow(); }catch(e){} }
}

// ===== 行き止まり改善：LINE外/未ログインで line_uid が取れない時の「LINEで開き直す」ボタン =====
// （poc/_pure.mjs の同名関数と実装を一致させること＝テストで構文照合する）
function isValidLiffId(id){ return /^\d{6,}-[0-9A-Za-z]+$/.test(String(id==null?'':id).trim()); }
function buildLiffOpenUrl(liffId, store, mode, ref){
  var id=String(liffId==null?'':liffId).trim();
  if(!isValidLiffId(id)) return null;            // 空/形式不正→出さない（誤った店へ飛ばさない・空飛び防止）
  var url='https://liff.line.me/'+id;            // LIFF ID はパスに直結（エンコード不要）
  var q=[];
  if(store) q.push('store='+encodeURIComponent(store));
  if(mode && mode!=='book') q.push('mode='+encodeURIComponent(mode));
  if(ref) q.push('ref='+encodeURIComponent(ref)); // refは必ず引き継ぐ（流入元タグを保つ）
  if(q.length) url+='?'+q.join('&');
  return url;
}
// 行き止まり画面の container（空div）に「LINEで開き直す」ボタンをDOMで生成して追加する（4モード共通）。
//   ・STORE_RESOLVED_OK（この店のLIFFを確定できた）が立つ時だけ出す＝取り違え防止。
//   ・innerHTML連結でなくcreateElementで作る＝エラー文(textContent)の上書きでボタンが消える事故を防ぐ。
function renderLiffOpenButton(container, label, mode){
  if(!container) return;
  if(!STORE_RESOLVED_OK) return;                 // 店のLIFF未確定なら出さない
  var url=buildLiffOpenUrl(LIFF_ID, STORE, mode, REF);
  if(!url) return;                               // 念のための二重ガード
  var btn=document.createElement('button');
  btn.type='button'; btn.className='btn btn-p';
  btn.style.display='inline-block';              // CSSのdisplay:none対策（明示値）
  btn.style.marginTop='16px'; btn.style.paddingLeft='28px'; btn.style.paddingRight='28px';
  btn.textContent=label;                         // 文言はtextContent（XSS不可）
  btn.addEventListener('click', function(){
    var u=buildLiffOpenUrl(LIFF_ID, STORE, mode, REF); // 押下時に再評価（確定後の値）
    if(u) location.href=u;
  });
  container.appendChild(btn);
}

function showCancelDone(dt){
  var body=document.getElementById('cancelBody'); if(!body) return;
  body.innerHTML='<div class="soon-box"><div class="done-icon">✅</div><div class="done-title">キャンセルを承りました</div><div class="done-msg">'+esc(dt||'')+' のご予約をキャンセルしました。<br>またのご予約をお待ちしております。</div><button class="btn btn-p" onclick="backToTalk()" style="display:inline-block;margin-top:24px;padding-left:36px;padding-right:36px;">LINEに戻る</button></div>';
}
// キャンセルボタン（イベント委譲・data-* から取得＝注入対策）
document.addEventListener('click', function(e){
  var b=(e.target&&e.target.closest)?e.target.closest('.cl-x'):null;
  if(!b) return;
  var rid=b.getAttribute('data-rid'), dt=b.getAttribute('data-dt');
  if(!window.confirm((dt||'このご予約')+' をキャンセルします。よろしいですか？')) return;
  b.disabled=true; b.textContent='キャンセル中…';
  sbEdge('cancel',{p_resv:rid}).then(function(r){
    if(r&&r.ok){ showCancelDone(dt); return; }
    b.disabled=false; b.textContent='このご予約をキャンセル';
    var msg=(r&&r.data&&r.data.message)||'';
    if(/too_late/.test(msg)) window.alert('ご予約時間が近い／過ぎているため、Web上ではキャンセルできません。お手数ですが公式LINEのトークからご連絡ください。');
    else if(/already_cancelled/.test(msg)){ window.alert('このご予約はすでにキャンセル済みです。'); loadCancelList(); }
    else window.alert('キャンセルできませんでした。お手数ですが公式LINEのトークからご連絡ください。');
  }).catch(function(){ b.disabled=false; b.textContent='このご予約をキャンセル'; window.alert('通信エラーが発生しました。'); });
});

// ===== 事前問診票（?mode=questionnaire）：本人のLINE IDトークンで送信→カルテ自動反映 =====
function qRadio(name,opts){ return '<div class="q-opts">'+opts.map(function(o,i){ return '<label class="q-opt"><input type="radio" name="'+name+'" value="'+esc(o)+'"'+(i===0?' checked':'')+'> '+esc(o)+'</label>'; }).join('')+'</div>'; }
function qCheck(name,opts){ return '<div class="q-opts">'+opts.map(function(o){ return '<label class="q-opt"><input type="checkbox" name="'+name+'" value="'+esc(o)+'"> '+esc(o)+'</label>'; }).join('')+'</div>'; }
function qVal(name){ var el=document.querySelector('input[name="'+name+'"]:checked'); return el?el.value:''; }
function qChecks(name){ var a=[]; var els=document.querySelectorAll('input[name="'+name+'"]:checked'); for(var i=0;i<els.length;i++) a.push(els[i].value); return a; }
function qLoad(){
  var body=document.getElementById('qBody'); if(!body) return;
  if(!st.idToken){
    body.innerHTML='<div class="soon-box"><div class="done-icon">📱</div><div class="done-title">LINEから開いてください</div><div class="done-msg">事前問診は、公式LINEのトーク画面（問診のご案内）から開いてご記入ください。</div><div id="qLiffAct"></div></div>';
    renderLiffOpenButton(document.getElementById('qLiffAct'), 'LINEで問診を続ける', 'questionnaire');   // ★LINEで開き直すボタン
    return;
  }
  var dz=['高血圧','糖尿病','心臓の病気','アレルギー体質','ケロイド体質','皮膚の病気','感染症（肝炎等）','その他'];
  var h=''
    +'<div class="cl-intro">ご来店前に、下記の事前問診をご記入ください。<br><span class="cl-sub">※未記入の場合、当日施術ができないことがあります。</span></div>'
    +'<div class="q-f"><label class="q-l">お名前<span class="q-req">必須</span></label><input id="q_name" class="q-in" type="text" value="'+esc((st.bookingName||st.displayName)||'')+'"></div>'
    +'<div class="q-f"><label class="q-l">電話番号<span class="q-req">必須</span></label><input id="q_phone" class="q-in" type="tel" inputmode="numeric" placeholder="09012345678"></div>'
    +'<div class="q-f"><label class="q-l">生年月日</label><input id="q_birth" class="q-in" type="date"></div>'
    +'<div class="q-f"><label class="q-l">性別</label>'+qRadio('q_gender',['女性','男性','その他'])+'</div>'
    +'<div class="q-f"><label class="q-l">ご住所（市区町村まで）</label><input id="q_area" class="q-in" type="text" placeholder="例：久留米市〇〇町"></div>'
    +'<div class="q-f"><label class="q-l">既往歴・持病（あてはまるもの全て）</label>'+qCheck('q_dz',dz)+'</div>'
    +'<div class="q-f"><label class="q-l">現在服用中のお薬</label><input id="q_meds" class="q-in" type="text" placeholder="無ければ「なし」"></div>'
    +'<div class="q-f"><label class="q-l">妊娠中・授乳中ですか？</label>'+qRadio('q_preg',['いいえ','妊娠中','授乳中'])+'</div>'
    +'<div class="q-f"><label class="q-l">金属・麻酔のアレルギー</label>'+qRadio('q_alg',['なし','あり','わからない'])+'</div>'
    +'<div id="q_err" class="msg-err" style="display:none;margin:8px 0;"></div>'
    +'<button class="btn btn-p" id="q_submit" onclick="qSubmit()" style="width:100%;margin-top:8px;">この内容で送信する</button>'
    +'<div class="cl-note">送信後、内容はクリニックのカルテに反映されます。</div>';
  body.innerHTML=h;
  // 本名（予約の手入力名）を一度だけ取得し、お名前欄を本名でプリフィル（同意書と同じ出どころに統一）。
  // 取得できなければLINE名のまま。お客様が手で書き換え始めていたら上書きしない。
  if (st.bookingName === undefined){
    st.bookingName = '';
    sbEdge('list',{}).then(function(r){
      if (r && r.ok && Array.isArray(r.data)){
        for (var i=0;i<r.data.length;i++){
          if (r.data[i] && r.data[i].customer_name){ st.bookingName = String(r.data[i].customer_name); break; }
        }
      }
      var el = document.getElementById('q_name');
      if (el && st.bookingName && (!el.value || el.value === (st.displayName||''))) el.value = st.bookingName;
    }).catch(function(){});
  }
}
function qSubmit(){
  var nameEl=document.getElementById('q_name'), phoneEl=document.getElementById('q_phone'), err=document.getElementById('q_err');
  var name=(nameEl.value||'').trim();
  var phone=(phoneEl.value||'').replace(/[^0-9]/g,'');
  if(!name||phone.length<10){ err.style.display='block'; err.textContent='お名前と電話番号（数字10桁以上）をご入力ください。'; return; }
  err.style.display='none';
  var dz=qChecks('q_dz');
  var answers={
    '氏名':name,
    '生年月日':(document.getElementById('q_birth').value||''),
    '性別':qVal('q_gender'),
    'ご住所':(document.getElementById('q_area').value||'').trim(),
    '既往歴・持病': dz.length?dz.join('、'):'なし',
    '服用中のお薬':(document.getElementById('q_meds').value||'').trim()||'なし',
    '妊娠・授乳':qVal('q_preg'),
    '金属・麻酔アレルギー':qVal('q_alg')
  };
  var btn=document.getElementById('q_submit'); btn.disabled=true; btn.textContent='送信中…';
  sbEdge('questionnaire',{p_phone:phone,p_answers:answers}).then(function(r){
    if(r&&r.ok){ qDone(); return; }
    btn.disabled=false; btn.textContent='この内容で送信する';
    err.style.display='block'; err.textContent='送信できませんでした。お手数ですが時間をおいて再度お試しください。';
  }).catch(function(){ btn.disabled=false; btn.textContent='この内容で送信する'; err.style.display='block'; err.textContent='通信エラーが発生しました。電波の良い場所で再度お試しください。'; });
}
function qDone(){
  var body=document.getElementById('qBody'); if(!body) return;
  body.innerHTML='<div class="soon-box"><div class="done-icon">✅</div><div class="done-title">ご記入ありがとうございました</div><div class="done-msg">事前問診を受け付けました。<br>当日お会いできるのを楽しみにしております。</div><button class="btn btn-p" onclick="backToTalk()" style="display:inline-block;margin-top:24px;padding-left:36px;padding-right:36px;">LINEに戻る</button></div>';
}

  h+='<div class="cs-photo-note">※モニター・キャンペーンご利用の患者様に関しましては、全てお写真のご提供が必要となります。また、カルテ保存・記録のため全ての方の施術前後のお写真は撮らせて頂いております。</div>';
  consentPhotoQuestions().forEach(function(q){
    h+='<div class="cs-q"><div class="cs-q-label">'+esc(q.label)+'</div>'
      +'<div class="cs-yn" data-cskey="'+esc(q.key)+'">'
      +'<button type="button" class="cs-yn-yes" data-csval="yes">はい</button>'
      +'<button type="button" class="cs-yn-no on-no" data-csval="no">いいえ</button>'
      +'</div></div>';
  });
  // 署名 canvas
  h+='<div class="cs-sec">ご署名</div>';
  h+='<div class="cs-sign-wrap"><div class="cs-sign-hd"><span class="lbl">下の枠内に指でご署名ください</span>'
    +'<button type="button" class="cs-sign-clear" id="csClear">書き直す</button></div>'
    +'<canvas id="consentCanvas"></canvas>'
    +'<div class="cs-sign-hint">枠の中を指でなぞると署名できます。間違えたら「書き直す」で消せます。</div></div>';
  h+='<div id="csSubmitErr" class="cs-submit-err"></div>';
  body.innerHTML=h;

  // 送信ボタンは固定フッターに出す（予約ウィザードと同じ step-nav）。s-consent には専用フッターを足す。
  ensureConsentNav();
  setupConsentCanvas();
  updateConsentSubmit();

  // 本人の予約から本名（予約時の手入力名）を一度だけ取得し、挨拶を本名に差し替える。
  //   取得できなければ（予約が無い/サーバ未対応）LINE名のまま。署名フォームは作り直さない（挨拶だけ更新）。
  if (st.bookingName === undefined){
    st.bookingName = '';
    sbEdge('list',{}).then(function(r){
      if (r && r.ok && Array.isArray(r.data)){
        for (var i=0;i<r.data.length;i++){
          if (r.data[i] && r.data[i].customer_name){ st.bookingName = String(r.data[i].customer_name); break; }
        }
      }
      var g = document.querySelector('#s-consent .cs-greet');
      var nn = (st.bookingName || st.displayName || '').trim();
      if (g && nn) g.textContent = nn + ' 様';
    }).catch(function(){});
  }
}

// s-consent 用の固定フッター（送信ボタン）を一度だけ用意。
function ensureConsentNav(){
  var sec=document.getElementById('s-consent');
  if(!sec) return;
  if(document.getElementById('csNav')) return;
  var nav=document.createElement('nav');
  nav.className='step-nav';
  nav.id='csNav';
  nav.innerHTML='<button class="btn btn-p" id="csSubmit" onclick="submitConsentForm()" disabled>同意して署名を送信</button>';
  sec.appendChild(nav);
}

// 写真使用 はい/いいえ トグル（イベント委譲・data-* から取得＝注入対策）。
document.addEventListener('click', function(e){
  var btn=(e.target&&e.target.closest)?e.target.closest('.cs-yn button'):null;
  if(!btn) return;
  var wrap=btn.closest('.cs-yn'); if(!wrap) return;
  var key=wrap.getAttribute('data-cskey'), val=btn.getAttribute('data-csval');
  if(!key||!consentPhoto.hasOwnProperty(key)) return;
  consentPhoto[key]=(val==='yes')?'yes':'no';
  // 見た目を反映
  var yes=wrap.querySelector('.cs-yn-yes'), no=wrap.querySelector('.cs-yn-no');
  if(yes) yes.className='cs-yn-yes'+(consentPhoto[key]==='yes'?' on-yes':'');
  if(no)  no.className ='cs-yn-no'+(consentPhoto[key]==='no'?' on-no':'');
});

// 「書き直す」ボタン（イベント委譲）。
document.addEventListener('click', function(e){
  var b=(e.target&&e.target.closest)?e.target.closest('#csClear'):null;
  if(!b) return;
  clearConsentCanvas();
});

// canvas を画面幅に合わせて初期化し、指/マウスの描画ハンドラを付ける。
function setupConsentCanvas(){
  csCanvas=document.getElementById('consentCanvas');
  if(!csCanvas) return;
  // 表示サイズ（CSS）に内部解像度を合わせる。Retina対応で見た目をくっきりさせる。
  var rect=csCanvas.getBoundingClientRect();
  var dpr=window.devicePixelRatio||1;
  csCanvas.width=Math.round(rect.width*dpr);
  csCanvas.height=Math.round(rect.height*dpr);
  csCtx=csCanvas.getContext('2d');
  csCtx.setTransform(dpr,0,0,dpr,0,0); // 以降は CSS px 座標で描ける
  csCtx.fillStyle='#ffffff';
  csCtx.fillRect(0,0,rect.width,rect.height);
  csCtx.strokeStyle='#111111';
  csCtx.lineWidth=2.2;
  csCtx.lineCap='round';
  csCtx.lineJoin='round';
  csHasInk=false;

  // タッチ（指）。ページスクロールを止めるため preventDefault。
  csCanvas.addEventListener('touchstart', csTouchStart, { passive:false });
  csCanvas.addEventListener('touchmove',  csTouchMove,  { passive:false });
  csCanvas.addEventListener('touchend',   csTouchEnd,   { passive:false });
  csCanvas.addEventListener('touchcancel',csTouchEnd,   { passive:false });
  // マウス（PC確認用）。
  csCanvas.addEventListener('mousedown', csMouseDown);
  csCanvas.addEventListener('mousemove', csMouseMove);
  window.addEventListener('mouseup', csMouseUp);
}
// canvas 上の座標（CSS px）に変換。
function csPos(clientX, clientY){
  var rect=csCanvas.getBoundingClientRect();
  return { x:clientX-rect.left, y:clientY-rect.top };
}
function csBegin(x,y){ csDrawing=true; csLastX=x; csLastY=y; }
function csStroke(x,y){
  if(!csDrawing||!csCtx) return;
  csCtx.beginPath();
  csCtx.moveTo(csLastX,csLastY);
  csCtx.lineTo(x,y);
  csCtx.stroke();
  // 点（タップだけ）でも痕が残るように小さな点を打つ
  csCtx.beginPath(); csCtx.arc(x,y,1.1,0,Math.PI*2); csCtx.fillStyle='#111111'; csCtx.fill();
  csLastX=x; csLastY=y; csHasInk=true; updateConsentSubmit();
}
function csTouchStart(e){ e.preventDefault(); if(!e.touches.length)return; var p=csPos(e.touches[0].clientX,e.touches[0].clientY); csBegin(p.x,p.y); csStroke(p.x,p.y); }
function csTouchMove(e){ e.preventDefault(); if(!csDrawing||!e.touches.length)return; var p=csPos(e.touches[0].clientX,e.touches[0].clientY); csStroke(p.x,p.y); }
function csTouchEnd(e){ e.preventDefault(); csDrawing=false; }
function csMouseDown(e){ var p=csPos(e.clientX,e.clientY); csBegin(p.x,p.y); csStroke(p.x,p.y); }
function csMouseMove(e){ if(!csDrawing)return; var p=csPos(e.clientX,e.clientY); csStroke(p.x,p.y); }
function csMouseUp(){ csDrawing=false; }

// 署名を消す（白で塗り直す）。
function clearConsentCanvas(){
  if(!csCanvas||!csCtx) return;
  var rect=csCanvas.getBoundingClientRect();
  csCtx.fillStyle='#ffffff';
  csCtx.fillRect(0,0,rect.width,rect.height);
  csHasInk=false;
  csDrawing=false;
  var err=document.getElementById('csSubmitErr'); if(err){ err.className='cs-submit-err'; err.textContent=''; }
  updateConsentSubmit();
}
// 署名が空なら送信ボタンを無効化。
function updateConsentSubmit(){
  var b=document.getElementById('csSubmit'); if(b) b.disabled=!csHasInk;
}

// 署名送信：submit_consent RPC。成功で完了画面、失敗は日本語で再試行可能に。
function submitConsentForm(){
  if(!csHasInk){ return; }
  if(!st.idToken){
    // 本人確認トークンが無い（LINE外/openid未許可）→ LINEから開き直しを促す（#92）
    var e0=document.getElementById('csSubmitErr');
    if(e0){ e0.className='msg-err'; e0.textContent='本人確認ができませんでした。公式LINEのトーク画面から開き直してお試しください。'; }
    return;
  }
  var btn=document.getElementById('csSubmit');
  var err=document.getElementById('csSubmitErr');
  if(err){ err.className='cs-submit-err'; err.textContent=''; }
  var dataUrl;
  try{ dataUrl=csCanvas.toDataURL('image/png'); }
  catch(e){ if(err){ err.className='msg-err'; err.textContent='署名の取得に失敗しました。お手数ですが書き直してお試しください。'; } return; }
  // ★送信前にサイズチェック（高DPR端末などで署名画像が大きくなりすぎる無駄な送信を防ぐ）
  if(!dataUrl || dataUrl.length > 2000000){ if(err){ err.className='msg-err'; err.textContent='署名のデータが大きすぎます。「書き直す」でやり直してから送信してください。'; } return; }
  if(btn){ btn.disabled=true; btn.textContent='送信中…'; }
  sbEdge('consent',{
    p_customer_name: ((st.bookingName && String(st.bookingName).trim()) || st.displayName || ''),
    p_tv_full: consentPhoto.tv_full,
    p_tv_part: consentPhoto.tv_part,
    p_sns_full: consentPhoto.sns_full,
    p_sns_part: consentPhoto.sns_part,
    p_signature: dataUrl,
    p_version: CONSENT_VERSION
  }).then(function(r){
    if(r&&r.ok){ showConsentDone(); return; }
    consentSubmitFail(btn, consentErrMsg(r));
  }).catch(function(){
    consentSubmitFail(btn,'送信に失敗しました。電波の良い場所で、もう一度お試しください。');
  });
}
// submit_consent の失敗メッセージ（no_uid/no_signature/signature_too_large 等）を日本語へ。
function consentErrMsg(r){
  var msg=(r&&r.data&&(r.data.message||r.data.hint))||'';
  msg=String(msg);
  if(/signature_too_large/.test(msg)) return '署名が大きすぎます。お手数ですが「書き直す」でやり直してから送信してください。';
  if(/no_signature/.test(msg))        return '署名が空のようです。枠内にご署名のうえ、もう一度お試しください。';
  if(/bad_signature/.test(msg))       return '署名データを読み取れませんでした。「書き直す」でやり直してお試しください。';
  if(/no_uid/.test(msg))              return 'お客様の確認ができませんでした。公式LINEのトーク画面から開き直してお試しください。';
  if(/no_tenant/.test(msg))           return '設定エラーが発生しました。お手数ですが公式LINEのトークからご連絡ください。';
  if(/no_reservation/.test(msg))      return 'ご予約が確認できませんでした。先にご予約のうえ、ご来店時にスタッフへお声がけください。';
  return '署名の送信に失敗しました。お手数ですが、もう一度お試しください。';
}
function consentSubmitFail(btn, msg){
  if(btn){ btn.disabled=false; btn.textContent='同意して署名を送信'; }
  var err=document.getElementById('csSubmitErr');
  if(err){ err.className='msg-err'; err.textContent=msg; window.scrollTo(0,document.body.scrollHeight); }
}
// 送信完了画面（LINEのトークへ戻るボタン）。固定フッターは隠す。
function showConsentDone(){
  var body=document.getElementById('consentBody'); if(!body) return;
  var nav=document.getElementById('csNav'); if(nav) nav.style.display='none';
  body.innerHTML='<div class="soon-box cs-done"><div class="done-icon">✅</div><div class="done-title">同意書を受け付けました</div><div class="done-msg">ご署名ありがとうございました。<br>当日はお気をつけてお越しください。</div><button class="btn btn-p" onclick="backToTalk()" style="display:inline-block;margin-top:24px;padding-left:36px;padding-right:36px;">LINEのトークに戻る</button></div>';
}

// ===== Supabase からマスタ＋店舗設定を取得し、GAS版 options 互換の形へ組み立て =====
// 互換キー：options = { nurses:[{nurse_id,name,is_active,profile_photo_url}],
//   menus:[{menu_id,menu_name,normal_price,monitor_price}],
//   certified:[{nurse_id,menu_id,is_certified,duration_new_min,duration_retouch_min}],
//   store_name, openMin, closeMin, interval, closed }
function loadOptions(){
  // ★マスタは public_booking_options RPC で一括取得（anonの直selectは撤去済＝他テナント横断列挙を防止）。
  //   返却＝{ store:{営業設定}, artists:[店内・有効], menus:[テナント内・有効], artist_menus:[認定組合せ] }
  sbRpc("public_booking_options", { p_store_id: STORE_ID }).then(function(res){
    var d=(res&&res.ok&&res.data&&typeof res.data==='object')?res.data:{};
    // ★Array.isArray でガード（RLS/列名ミスでエラーJSONが返っても .map で落ちない）
    var artists=Array.isArray(d.artists)?d.artists:[];
    var menus  =Array.isArray(d.menus)?d.menus:[];
    var am     =Array.isArray(d.artist_menus)?d.artist_menus:[];
    var store=(d.store&&typeof d.store==='object')?d.store:null;
    if(!artists.length){ bootOptDone=true; showWizardIfReady(); return; }

    // 担当できるメニューだけを artist_menus で絞る（poc/index.html boot() と同じ考え方）。
    // 施術時間は artist_menus の duration を優先。
    var nurses=artists.map(function(a){
      return { nurse_id:a.id, name:a.name, is_active:a.is_active, profile_photo_url:a.profile_photo_url||'',
               qualification:a.qualification||'', specialty:a.specialty||'' };
    });
    var menusC=menus.map(function(m){
      return { menu_id:m.id, menu_name:m.name, normal_price:m.price_normal, monitor_price:m.price_monitor,
               _dnew:m.duration_new_min, _dret:m.duration_retouch_min };
    });
    var certified=am.map(function(p){
      // artist_menus に duration が無ければ menus 側を使う。
      var mm=menusC.filter(function(x){return String(x.menu_id)===String(p.menu_id);})[0]||{};
      return {
        nurse_id:p.artist_id, menu_id:p.menu_id, is_certified:true,
        duration_new_min:(p.duration_new_min!=null?p.duration_new_min:mm._dnew),
        duration_retouch_min:(p.duration_retouch_min!=null?p.duration_retouch_min:mm._dret)
      };
    });

    var openMin=hmToMin(store&&store.business_hours_start, DEF_OPEN_H*60);
    var closeMin=hmToMin(store&&store.business_hours_end, DEF_CLOSE_H*60);
    var interval=(store&&store.slot_interval_min&&store.slot_interval_min>0)?store.slot_interval_min:DEF_INTERVAL;

    bootOpt={
      nurses:nurses, menus:menusC, certified:certified,
      store_name:(store&&store.name)||'',
      openMin:openMin, closeMin:closeMin, interval:interval,
      closed:parseClosed(store&&store.closed_days)
    };
    bootOptDone=true;
    if(wizardShown){ st.options=bootOpt; applyInitialArtist(); updHeader(); if(MODE==='book'&&st.step===1) render(); }
    else showWizardIfReady();
  }).catch(function(){
    bootOptDone=true; if(!wizardShown) showWizardIfReady();
  });
}

// ===== LIFF：本人(UID・表示名)を取得（LINE内で開いたときだけ。失敗しても予約は続行） =====
function initLiff(){
  if(!LIFF_ID || typeof liff==='undefined'){ profileDone(); return; }
  var advanced=false;
  var tid=setTimeout(function(){ if(!advanced){ advanced=true; profileDone(); } },8000);
  function advance(){ if(advanced)return; advanced=true; clearTimeout(tid); profileDone(); }
  function applyLateProfile(p){
    if(!p) return;
    if(p.userId)      st.uid=p.userId;
    if(p.displayName) st.displayName=p.displayName;
    updHeader();
  }
  try{
    liff.init({liffId:LIFF_ID}).then(function(){
      if(!liff.isLoggedIn||!liff.isLoggedIn()){ advance(); return; }
      // ★#92：本人確認用のIDトークンを取得（openidスコープが必要）。キャンセル/同意書で使う。
      try{ st.idToken = (liff.getIDToken && liff.getIDToken()) || ''; }catch(e){ st.idToken=''; }
      liff.getProfile().then(function(p){ applyLateProfile(p); })
                       .catch(function(){})
                       .then(advance);
    }).catch(function(){ advance(); });
  }catch(e){ advance(); }
}

// ===== 店舗設定の解決（多テナント化・段階3） =====
// URLの ?store=スラッグ から stores を引いて、この店の id/tenant/name/LIFF を確定する。
//   ・取得できれば STORE_ID / TENANT_ID / STORE_NAME / LIFF_ID を上書き（小倉など）。
//   ・取得失敗時は既定（久留米）の埋め込み値のまま＝後方互換（久留米は今まで通り動く）。
// ※セキュリティ操作（キャンセル/同意書/問診）はサーバ側(super-api)が id_token の aud で
//   店を確定する。ここでの店確定は「表示するマスタ（メニュー等）を正しく選ぶ」ためだけで、
//   スラッグを偽っても他店データの漏えいにはならない。
// 戻り値（Promise<boolean>）：true=このまま起動してよい／false=店が特定できないので止める。
//   ・解決できた → その店の値を採用して true。
//   ・解決できない（行が無い/SQL未適用/通信失敗）→
//       未指定 or 既定(kurume) なら久留米のまま true（後方互換）。
//       明示的に別店(kokura等)が指定されていたのに見つからない時は false（久留米予約への誤倒れを防ぐ）。
function resolveStoreConfig(){
  function fallbackOk(){ return (!STORE_RAW || STORE_RAW==='kurume'); }
  // ★公開リンクは public_slug（全店で一意）で引く。code は (tenant_id,code) でしか一意でないため使わない。
  return sbRpc("public_store_resolve", { p_slug: STORE })
    .then(function(res){
      var s=(res&&res.ok&&res.data&&typeof res.data==='object')?res.data:null;
      if(s){
        if(s.id)        STORE_ID   = s.id;
        if(s.tenant_id) TENANT_ID  = s.tenant_id;
        if(s.name)      STORE_NAME = s.name;
        if(s.liff_id){ LIFF_ID = s.liff_id; return true; }
        // 店は特定できたが、この店のLIFFが未設定（例：小倉のLIFF作成前）。
        var explicitOther = (STORE_RAW && STORE_RAW!=='kurume');
        if(explicitOther){
          // 既定(久留米)LIFFへ倒すと別テナントとして本人確認されてしまう→ LIFFは使わない。
          LIFF_ID='';
          // 本人確認が要るモード（キャンセル/同意書/問診）はこの店のLIFFが無いと成立しない → 停止。
          if(MODE!=='book') return false;
        }
        return true; // 予約(book)はLIFF無しでも作成可能（uidは付かない）。
      }
      return fallbackOk();
    })
    .catch(function(){ return fallbackOk(); });
}

// 店が特定できない時のエラー表示（誤った店で予約させない）。
function showStoreError(){
  try{
    document.body.innerHTML =
      '<div style="max-width:480px;margin:80px auto;padding:24px;font-family:sans-serif;text-align:center;color:#333;">'
      + '<div style="font-size:44px;">🏥</div>'
      + '<h2 style="font-size:18px;margin:16px 0;">お店が見つかりませんでした</h2>'
      + '<p style="font-size:14px;line-height:1.8;color:#666;">この予約ページのリンクが正しくない可能性があります。<br>'
      + 'お手数ですが、お店の公式LINEのメニューから、もう一度お試しください。</p>'
      + '</div>';
  }catch(e){}
}

(function boot(){
  // ★まず店舗設定を解決してから初期化（LIFF_ID/STORE_ID/TENANT_ID を店に合わせる）。
  resolveStoreConfig().then(function(ok){
    if(!ok){ showStoreError(); return; }  // 明示された店が特定できない → 久留米へ倒さず停止。
    // ★この店のLIFFを有効に確定できた時だけ、行き止まりで「LINEで開き直す」ボタンを出す（取り違え防止）。
    STORE_RESOLVED_OK = isValidLiffId(LIFF_ID);
    // 予約モードのみマスタ取得（キャンセルは自分の予約一覧をUID確定後に取得・同意書は準備中）。
    if(MODE==='book') loadOptions();
    initLiff();
    // 予約以外（キャンセル/同意書）は即この画面を表示（キャンセルは続いてUID確定後に一覧取得）。
    if(MODE!=='book') showWizardIfReady();
  });
})();
